<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="pinkGradient" x1="40" y1="40" x2="216" y2="216">
      <stop offset="0%" stop-color="#FF4FD8"></stop>
      <stop offset="100%" stop-color="#FF1493"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="#0F0F13"></rect>

  <!-- Glow Ring -->
  <circle cx="128" cy="128" r="82" stroke="url(#pinkGradient)" stroke-width="10" opacity="0.25" filter="url(#glow)"></circle>

  <!-- Shield -->
  <path d="M128 42L192 68V118C192 167 164 206 128 220C92 206 64 167 64 118V68L128 42Z" fill="url(#pinkGradient)"></path>

  <!-- Lock -->
  <rect x="94" y="104" width="68" height="56" rx="14" fill="white"></rect>

  <path d="M108 104V88C108 74 117 64 128 64C139 64 148 74 148 88V104" stroke="white" stroke-width="10" stroke-linecap="round"></path>

  <!-- Keyhole -->
  <circle cx="128" cy="126" r="8" fill="#FF1493"></circle>
  <rect x="124" y="133" width="8" height="18" rx="4" fill="#FF1493"></rect>

  <!-- Random Password Accent -->
  <text x="92" y="196" fill="#FF7AE6" font-size="18" font-family="monospace" font-weight="700">
    *#A7!
  </text>

</svg>